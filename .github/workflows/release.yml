name: Release

# INFRA-06: cross-platform standalone binaries, published to a GitHub
# Release whenever a vX.Y.Z tag is pushed. A plain GOOS/GOARCH matrix
# build (not goreleaser) — modernc.org/sqlite is pure Go, so
# CGO_ENABLED=0 cross-compilation just works with the stock toolchain
# and there's nothing goreleaser buys here that a few `go build` lines
# don't already cover.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  frontend:
    name: Build frontend (static)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # BUILD_TARGET=static (svelte.config.js) switches to
      # adapter-static's fallback-SPA build — see that file's comment
      # for why the deployed stack's adapter-node build can't be
      # embedded in the Go binary instead.
      - run: npm run build:static

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: web/build
          retention-days: 1

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: web/build

      # Same "copy the static build into internal/webui/dist/ right
      # before go:embed needs it" step as `make web-build-standalone`
      # (Makefile) — go:embed reads the directory at compile time, so
      # the frontend build has to land here first.
      - name: Embed frontend
        run: |
          find internal/webui/dist -mindepth 1 ! -name '.gitkeep' -delete
          cp -r web/build/. internal/webui/dist/

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p out
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -ldflags "-X main.version=${{ github.ref_name }}" \
            -o "out/financial-tracker-standalone${ext}" ./internal/cmd/api

      - name: Package + checksum
        run: |
          name="financial-tracker-standalone-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd out
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "../${name}.zip" "financial-tracker-standalone.exe"
          else
            tar -czf "../${name}.tar.gz" "financial-tracker-standalone"
          fi
          cd ..
          sha256sum "${name}".tar.gz "${name}".zip 2>/dev/null > "${name}.sha256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            financial-tracker-standalone-*.tar.gz
            financial-tracker-standalone-*.zip
            financial-tracker-standalone-*.sha256
          retention-days: 1

  smoke-test:
    name: Smoke test (linux/amd64 artifact)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-amd64
          path: dist

      - name: Run the real artifact and hit it over HTTP
        run: |
          cd dist
          tar -xzf financial-tracker-standalone-linux-amd64.tar.gz
          chmod +x financial-tracker-standalone
          STANDALONE=true PORT=18081 ./financial-tracker-standalone &
          for i in $(seq 1 20); do
            curl -sf http://localhost:18081/config >/dev/null && break
            sleep 0.5
          done
          echo "--- GET /config ---"
          curl -sf http://localhost:18081/config
          echo
          echo "--- GET / (embedded UI) ---"
          curl -sf http://localhost:18081/ | grep -qi "<html" && echo "index.html served OK"

  release:
    name: Publish GitHub Release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
