# Assumes ledger-service is checked out as a sibling directory
# (../ledger-service) - this stack builds it directly from source rather
# than duplicating its Dockerfile/migrations here.
version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: ledger_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../ledger-service/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:z
      - ../ledger-service/migrations/001_create_transactions_table.sql:/docker-entrypoint-initdb.d/001_create_transactions_table.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # financial-tracker's own database. Separate from the ledger-service
  # `postgres` service above (different schema, different service
  # entirely) — named ft-postgres to match deploy/compose.yaml's
  # equivalent. BACK-21: SQLite is never a real multi-tenant server
  # backend, even in this dev-convenience stack (main.go's `case
  # "sqlite":` now refuses to start unless STANDALONE=true) — this dev
  # stack runs the same `postgres`-backed server path production does,
  # not a special-cased sqlite shortcut.
  ft-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: financial-tracker-postgres
    environment:
      POSTGRES_USER: financial_tracker
      POSTGRES_PASSWORD: financial_tracker
      POSTGRES_DB: financial_tracker
    volumes:
      - ft_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_tracker -d financial_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No host port: only financial-tracker (below) talks to this.

  ledger-service:
    build:
      context: ../ledger-service
      dockerfile: Dockerfile
    container_name: ledger-service
    environment:
      DATABASE_URL: postgres://test:test123@postgres:5432/ledger_db?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  financial-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-tracker-api
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://financial_tracker:financial_tracker@ft-postgres:5432/financial_tracker?sslmode=disable
      LEDGER_SERVICE_URL: http://ledger-service:8080
      PORT: 8081
      # No auth yet in this dev-convenience stack — every request
      # attributes to this fixed user. See deploy/compose.yaml for the
      # real Authentik-backed stack.
      AUTH_DISABLED: "true"
      DEFAULT_USER_ID: 00000000-0000-0000-0000-000000000001
      DEFAULT_CURRENCY: usd
      # Dev-only fixed secrets (same "just works, zero setup" pattern as
      # the postgres test/test123 credentials above) — never used outside
      # this local dev stack. Real deployments generate their own via
      # `openssl rand -base64 32` (see deploy/.env.example).
      ENCRYPTION_MASTER_KEY: GWv/njuBZVG9gkjKOyV1VuhaenDX90mw1UacYFYYFPg=
      LEDGER_HMAC_KEY: MUnk2IeyonsbFWEvl8N+O8HRceDHOqxkOvWt/rPg8CM=
      BILLING_WEBHOOK_SECRET: 6UlTechOweSX44LZ4EO6e1NFeMhiT1gjxStINekgzJM=
    ports:
      - "8081:8081"
    depends_on:
      ft-postgres:
        condition: service_healthy
    # No depends_on ledger-service: financial-tracker's own database is
    # the source of truth and must come up (and work) even when
    # ledger-service is down; the background sync catches up later.

  web:
    image: docker.io/library/node:20-alpine
    container_name: financial-tracker-web
    working_dir: /app
    volumes:
      - ./web:/app:z
    environment:
      # Browser-facing URL - the browser runs on the host, not in the
      # compose network, so this must be the host-mapped port, not the
      # container DNS name.
      PUBLIC_API_URL: http://localhost:8081
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - financial-tracker

volumes:
  postgres_data:
  ft_postgres_data:
